# Configuration for Portion / Mass Estimation Module (Phase 6)

model:
  backbone: "efficientnet_b0"
  in_channels: 3               # 3 for RGB, 4 for RGB-D
  pretrained: true
  dropout: 0.2
  input_resolution: 224

training:
  epochs: 5
  batch_size: 8
  learning_rate: 0.0005
  weight_decay: 0.0001
  loss: "smooth_l1"            # smooth_l1 or l1 (Huber)

paths:
  weights: "models/portion/best_mass_regressor.pt"
  output_dir: "outputs/portion"
  reports_dir: "reports"
